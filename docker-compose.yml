services:
  monitoring:
    build: .
    container_name: monitoring
    restart: unless-stopped
    # Host-Netzwerk, damit der Container die MariaDB von Plesk unter 127.0.0.1:3306 erreicht
    # (Plesk-MariaDB lauscht meist nur lokal). Die Oberfläche ist dann direkt auf Port 8080 des Servers.
    network_mode: host
    # Zugangsdaten und Einstellungen: .env.example nach .env kopieren und ausfüllen
    env_file: .env
    volumes:
      - monitoring-data:/data

volumes:
  monitoring-data:
